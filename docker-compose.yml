version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    env_file: .env

    command: server --console-address ":${MINIO_CONSOLE_PORT}" --address ":${MINIO_PORT}" /data

    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"

    volumes:
      - ${MINIO_DATA_DIR}:/data
      - ${MINIO_CONFIG_DIR}:/root/.minio

    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${MINIO_PORT}/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c " until /usr/bin/mc alias set myminio http://minio:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      /usr/bin/mc mb myminio/${AWS_S3_BUCKET_NAME} --ignore-existing;

      /usr/bin/mc anonymous set none myminio/${AWS_S3_BUCKET_NAME}; "

networks:
  default:
    name: minio-network
